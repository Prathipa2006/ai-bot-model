<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIN-AI Finance Assistant</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="chat-header">
🤖 FIN-AI Finance Assistant
</div>

<!-- CHAT AREA -->
<div class="chat-body" id="chatBody"></div>

<!-- INPUT AREA -->
<div class="chat-footer">

<input type="text"
id="userInput"
placeholder="Ask about loans, EMI, savings..."
autocomplete="off">

<!-- VOICE BUTTON -->
<button class="voice-btn" onclick="startVoice()">🎤</button>

<!-- SEND BUTTON -->
<button onclick="sendMessage()">Send</button>

</div>
</div>

<!-- ROBOT IMAGE -->
<div class="bot-wrapper">
<img src="{{ url_for('static', filename='robot.jpeg') }}"
class="bot-img"
alt="Fin Robot">
<div class="bot-chest">FIN ROBOT</div>
</div>


<script>

//////////////////////////////////////////////////////
// BOT TYPING EFFECT
//////////////////////////////////////////////////////
function typeBotMessage(text, element, chatBody) {

let words = text.split(" ");
let i = 0;

let interval = setInterval(() => {

element.innerHTML += words[i] + " ";
chatBody.scrollTop = chatBody.scrollHeight;
i++;

if (i >= words.length) {
clearInterval(interval);
}

},80);
}



//////////////////////////////////////////////////////
// SEND MESSAGE
//////////////////////////////////////////////////////
function sendMessage(){

let input=document.getElementById("userInput");
let message=input.value.trim();

if(message==="") return;

let chatBody=document.getElementById("chatBody");

chatBody.innerHTML += `
<div class="user-message"><b>You:</b> ${message}</div>
`;

input.value="";
chatBody.scrollTop=chatBody.scrollHeight;


// SEND TO FLASK
fetch("/chat",{

method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ message:message })

})
.then(response=>response.json())
.then(data=>{

let botDiv=document.createElement("div");

botDiv.className="bot-message";
botDiv.innerHTML="<b>Bot:</b> ";

chatBody.appendChild(botDiv);

typeBotMessage(data.response,botDiv,chatBody);

})
.catch(error=>{

console.error("Error:",error);

chatBody.innerHTML+=`
<div class="bot-message" style="color:red;">
<b>System:</b> Server connection failed.
</div>
`;

});

}



//////////////////////////////////////////////////////
// ENTER KEY SUPPORT
//////////////////////////////////////////////////////
document.getElementById("userInput")
.addEventListener("keydown",function(event){

if(event.key==="Enter"){
event.preventDefault();
sendMessage();
}

});



//////////////////////////////////////////////////////
// VOICE RECOGNITION 🎤
//////////////////////////////////////////////////////
function startVoice(){

if(!('webkitSpeechRecognition' in window)){
alert("Voice recognition not supported in this browser.");
return;
}

const recognition=new webkitSpeechRecognition();

recognition.lang="en-IN";
recognition.continuous=false;
recognition.interimResults=false;

let inputbox=document.getElementById("userInput");
let micBtn=document.querySelector(".voice-btn");

recognition.start();


// mic started
recognition.onstart=function(){

inputbox.placeholder="Listening...";
micBtn.innerText="🎙";

}


// voice captured
recognition.onresult=function(event){

let transcript=event.results[0][0].transcript;

// remove special characters
transcript=transcript.replace(/[.,!?]/g,"");

inputbox.value=transcript;

inputbox.placeholder="Ask about loans, EMI, savings...";
micBtn.innerText="🎤";

};


// mic error
recognition.onerror=function(){

inputbox.placeholder="Ask about loans, EMI, savings...";
micBtn.innerText="🎤";

};


// mic stopped
recognition.onend=function(){

inputbox.placeholder="Ask about loans, EMI, savings...";
micBtn.innerText="🎤";

};

}

</script>

</body>
</html>
